{{- $name := include "mc.name" (list . "media") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "mc.labels" . | nindent 4 }}
    {{- include "mc.selectorLabels" (list . "media") | nindent 4 }}
spec:
  selector:
    {{- include "mc.selectorLabels" (list . "media") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.media.service.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "mc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.media.replicas }}
  selector:
    matchLabels:
      {{- include "mc.selectorLabels" (list . "media") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mc.labels" . | nindent 8 }}
        {{- include "mc.selectorLabels" (list . "media") | nindent 8 }}
      {{- with .Values.media.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "mc.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: {{ include "mc.image.nginx" . | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: MINIO_UPSTREAM
              {{- if .Values.minio.enabled }}
              value: {{ printf "%s.%s.svc.cluster.local:%v" (include "mc.name" (list . "minio")) (include "mc.namespace" .) .Values.minio.service.apiPort | quote }}
              {{- else }}
              value: {{ include "mc.minioEndpoint" . | quote }}
              {{- end }}
            - name: OUTPUT_BUCKET
              valueFrom: { configMapKeyRef: { name: {{ include "mc.configMapName" . }}, key: OUTPUT_BUCKET } }
            - name: NGINX_RESOLVER
              value: {{ .Values.media.resolver | quote }}
            - name: PUBLIC_API_BASE_URL
              value: {{ printf "https://%s" .Values.hosts.api | quote }}
          ports:
            - containerPort: {{ .Values.media.service.port }}
              name: http
          resources:
            {{- toYaml .Values.media.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.media.cache.sizeLimit }}
      {{- with .Values.media.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.media.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.media.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.media.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "mc.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.media.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "mc.selectorLabels" (list . "media") | nindent 6 }}
{{- end }}
