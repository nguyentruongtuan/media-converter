{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
# Placeholder values by default. Replace before deploying, ideally via Sealed Secrets, SOPS or
# External Secrets (set secrets.create=false and secrets.existingSecret) instead of committing
# real values. `scripts/generate-secrets.sh` writes a filled-in copy of the same keys.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mc.secretName" . }}
  labels:
    {{- include "mc.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  DATABASE_URL: {{ include "mc.databaseUrl" . | quote }}
  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  # Comma-separated name:key[:admin]
  API_KEYS: {{ .Values.secrets.apiKeys | quote }}
{{- end }}
