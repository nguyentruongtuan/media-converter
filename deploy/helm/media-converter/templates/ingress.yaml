{{- if .Values.ingress.enabled }}
# Requires ingress-nginx and cert-manager with the ClusterIssuer named in ingress.clusterIssuer.
{{- if .Values.ingress.api.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mc.name" (list . "api") }}
  labels:
    {{- include "mc.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- toYaml .Values.ingress.api.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.hosts.api | quote }}]
      secretName: {{ .Values.ingress.api.tlsSecretName }}
  rules:
    - host: {{ .Values.hosts.api | quote }}
      http:
        paths:
          {{- range .Values.ingress.api.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "mc.name" (list $ "api") }}
                port: { number: {{ $.Values.api.service.port }} }
          {{- end }}
{{- end }}
{{- if .Values.ingress.media.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mc.name" (list . "media") }}
  labels:
    {{- include "mc.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- toYaml .Values.ingress.media.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.hosts.media | quote }}]
      secretName: {{ .Values.ingress.media.tlsSecretName }}
  rules:
    - host: {{ .Values.hosts.media | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mc.name" (list . "media") }}
                port: { number: {{ .Values.media.service.port }} }
{{- end }}
{{- if .Values.ingress.s3.enabled }}
---
# Direct-to-MinIO uploads with presigned URLs. Size limits are enforced by the presigned POST policy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mc.name" (list . "s3") }}
  labels:
    {{- include "mc.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- toYaml .Values.ingress.s3.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.hosts.s3 | quote }}]
      secretName: {{ .Values.ingress.s3.tlsSecretName }}
  rules:
    - host: {{ .Values.hosts.s3 | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mc.name" (list . "minio") }}
                port: { number: {{ .Values.minio.service.apiPort }} }
{{- end }}
{{- end }}
