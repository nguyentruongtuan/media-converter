{{- $name := include "mc.name" (list . "transcode-worker") }}
# Replica count is owned by KEDA (see keda.yaml) when keda.enabled. Each pod runs exactly one
# transcode at a time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "mc.labels" . | nindent 4 }}
spec:
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mc.selectorLabels" (list . "transcode-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mc.labels" . | nindent 8 }}
        {{- include "mc.selectorLabels" (list . "transcode-worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "mc.imagePullSecrets" . | nindent 6 }}
      # SIGTERM triggers Celery's warm shutdown: the current job is allowed to finish. A job still
      # running when the grace period ends is killed; its message is redelivered (acks_late) and the
      # expired lease lets another worker claim and redo it.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: {{ include "mc.image.app" . | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["celery", "-A", "app.worker.celery_app", "worker",
                 "-Q", "transcode", "--pool=solo", "--concurrency=1", "--prefetch-multiplier=1",
                 "--without-gossip", "--without-mingle", "-n", "worker@%h", "--loglevel=INFO"]
          {{- include "mc.appEnvFrom" . | nindent 10 }}
          env:
            - name: WORKER_METRICS_PORT
              value: {{ .Values.worker.metricsPort | quote }}
          ports:
            - containerPort: {{ .Values.worker.metricsPort }}
              name: metrics
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          # A background thread touches this file every 15s, even while FFmpeg is busy.
          livenessProbe:
            exec:
              command: ["python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-alive') > 120)"]
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-alive') > 60)"]
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: scratch
              mountPath: {{ .Values.config.WORK_DIR }}
            - name: tmp
              mountPath: /tmp
      volumes:
        # Temporary transcoding space: source + all renditions + HLS segments for one job.
        # Use a generic ephemeral volume on a fast StorageClass instead if node disks are small.
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.worker.scratch.sizeLimit }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
