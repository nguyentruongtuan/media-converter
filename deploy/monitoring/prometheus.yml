# Prometheus config for the docker compose `monitoring` profile.
global:
  scrape_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: api
    metrics_path: /metrics/
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: transcode-worker
    # One A record per scaled replica (`docker compose up --scale worker=N`).
    dns_sd_configs: [{ names: [worker], type: A, port: 9101 }]
  - job_name: scheduler
    static_configs: [{ targets: ["scheduler:9101"] }]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs: [{ targets: ["minio:9000"] }]
