apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media-converter

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - postgres.yaml
  - redis.yaml
  - minio.yaml
  - api.yaml
  - worker.yaml
  - scheduler.yaml
  - nginx.yaml
  - ingress.yaml
  - keda.yaml
  - backups.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: media-converter
    includeSelectors: false

images:
  - name: media-converter
    newName: registry.example.com/media-converter
    newTag: 0.1.0
  - name: media-converter-nginx
    newName: registry.example.com/media-converter-nginx
    newTag: 0.1.0
  - name: media-converter-minio
    newName: registry.example.com/media-converter-minio
    newTag: RELEASE.2025-04-22T22-12-26Z
