<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HLS Player</title>
  <style>
    :root { color-scheme: light dark; --bg: #fafafa; --fg: #1a1a1a; --muted: #666; --border: #ddd; --accent: #2457d6; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141414; --fg: #eee; --muted: #999; --border: #333; --accent: #7aa2ff; } }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    a { color: var(--accent); }
    form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    input { flex: 1 1 320px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: inherit; }
    button, select { padding: 8px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
    select { background: transparent; color: inherit; }
    video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-top: 12px; color: var(--muted); font-size: 13px; }
    .err { color: #d33; }
    #osd { display: none; }
    body.tv { background: #000; color: #fff; font-size: max(16px, 1.25vw); overflow: hidden; }
    body.tv main { max-width: none; padding: 0; }
    body.tv main > h1, body.tv main > p, body.tv form, body.tv .row { display: none; }
    body.tv video { position: fixed; inset: 0; width: 100vw; height: 100vh; aspect-ratio: auto; border-radius: 0; }
    body.tv #osd { display: flex; flex-direction: column; justify-content: space-between; position: fixed; inset: 0; padding: 5vh 5vw; transition: opacity .2s; background: linear-gradient(#000b, #0000 30%, #0000 60%, #000d); }
    body.tv.idle #osd { opacity: 0; }
    #osd-title { font-size: 1.75em; font-weight: 600; overflow-wrap: anywhere; }
    #osd-bar { height: .4em; margin: .75em 0; border-radius: .2em; background: #fff4; overflow: hidden; }
    #osd-fill { height: 100%; width: 0; background: #fff; }
    #osd-info { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5em 2em; font-variant-numeric: tabular-nums; }
    #osd-hints { margin-top: .5em; color: #ccc; }
    #osd .err { color: #ff8a80; font-size: 1.25em; }
  </style>
</head>
<body>
<main>
  <h1>Adaptive HLS player</h1>
  <p><a href="./">Back to videos</a></p>
  <form id="f">
    <input id="src" type="url" placeholder="https://media.example.com/media/&lt;video&gt;/&lt;job&gt;/hls/master.m3u8" required>
    <button>Play</button>
  </form>
  <video id="v" controls playsinline></video>
  <div class="row">
    <label>Quality <select id="q"><option value="-1">Auto</option></select></label>
    <span id="engine"></span>
    <span id="level"></span>
    <span id="bw"></span>
    <span id="msg" class="err"></span>
  </div>
  <div id="osd">
    <div id="osd-title"></div>
    <div id="osd-bottom">
      <div id="osd-bar"><div id="osd-fill"></div></div>
      <div id="osd-info"><span id="osd-time"></span><span id="osd-state"></span><span id="osd-quality"></span></div>
      <div id="osd-hints">OK: play or pause · Left, Right: 10 seconds · Up, Down: quality · Back: videos</div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
  const video = document.getElementById("v");
  const quality = document.getElementById("q");
  const status = (id, text) => (document.getElementById(id).textContent = text);
  let hls;

  function play(url) {
    status("msg", "");
    if (hls) { hls.destroy(); hls = null; }
    quality.length = 1;
    // Prefer MSE (hls.js) where available: Chrome, Firefox, Edge, Android. Safari and iOS play HLS natively.
    if (window.Hls && Hls.isSupported()) {
      status("engine", "Engine: hls.js " + Hls.version);
      hls = new Hls({ capLevelToPlayerSize: true });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
        data.levels.forEach((l, i) => quality.add(new Option(`${l.height}p (${Math.round(l.bitrate / 1000)} kbps)`, i)));
        video.play().catch(() => {});
      });
      hls.on(Hls.Events.LEVEL_SWITCHED, (_, d) => status("level", "Playing: " + hls.levels[d.level].height + "p"));
      hls.on(Hls.Events.FRAG_LOADED, () => status("bw", "Est. bandwidth: " + Math.round(hls.bandwidthEstimate / 1000) + " kbps"));
      hls.on(Hls.Events.ERROR, (_, d) => {
        if (!d.fatal) return;
        status("msg", "Playback error: " + d.details);
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      });
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      status("engine", "Engine: native HLS");
      quality.disabled = true;
      video.src = url;
      video.play().catch(() => {});
    } else {
      status("msg", "This browser cannot play HLS.");
    }
  }

  quality.onchange = () => { if (hls) hls.currentLevel = Number(quality.value); };
  document.getElementById("f").onsubmit = (e) => {
    e.preventDefault();
    const url = document.getElementById("src").value;
    history.replaceState(null, "", "?src=" + encodeURIComponent(url));
    play(url);
  };
  const initial = new URLSearchParams(location.search).get("src");
  const params = new URLSearchParams(location.search);
  if (params.get("tv") === "1") setUpTv(params.get("title") || "");
  if (initial) { document.getElementById("src").value = initial; play(initial); }

  // Full screen playback driven by a TV remote: the native controls cannot be reached with a D-pad.
  function setUpTv(title) {
    const SEEK_SECONDS = 10;
    const OSD_MS = 4000;
    // Key codes are what TV remotes send when they have no usable event.key.
    const CODES = { 415: "play", 19: "pause", 179: "toggle", 10252: "toggle", 412: "back10", 417: "forward10", 413: "exit", 10009: "exit", 461: "exit" };
    const KEYS = {
      Enter: "toggle", " ": "toggle", MediaPlayPause: "toggle", MediaPlay: "play", MediaPause: "pause",
      ArrowLeft: "back10", MediaRewind: "back10", ArrowRight: "forward10", MediaFastForward: "forward10",
      ArrowUp: "qualityUp", ArrowDown: "qualityDown",
      Escape: "exit", Backspace: "exit", GoBack: "exit", BrowserBack: "exit", MediaStop: "exit",
    };
    const ACTIONS = {
      toggle: () => (video.paused ? video.play().catch(() => {}) : video.pause()),
      play: () => video.play().catch(() => {}),
      pause: () => video.pause(),
      back10: () => seek(-SEEK_SECONDS),
      forward10: () => seek(SEEK_SECONDS),
      qualityUp: () => changeQuality(-1),
      qualityDown: () => changeQuality(1),
      exit: () => (history.length > 1 ? history.back() : location.assign("./")),
    };
    let hideTimer;

    const clock = (s) => {
      if (!Number.isFinite(s)) return "--:--";
      const pad = (n) => String(Math.floor(n)).padStart(2, "0");
      return (s >= 3600 ? Math.floor(s / 3600) + ":" : "") + pad((s % 3600) / 60) + ":" + pad(s % 60);
    };
    function draw() {
      status("osd-time", clock(video.currentTime) + " / " + clock(video.duration));
      status("osd-state", video.paused ? "Paused" : "Playing");
      status("osd-quality", "Quality: " + quality.options[quality.selectedIndex].text);
      document.getElementById("osd-fill").style.width = (video.duration ? (video.currentTime / video.duration) * 100 : 0) + "%";
    }
    // The controls stay up while paused, so that a stopped picture never looks like a frozen TV.
    function showOsd() {
      document.body.classList.remove("idle");
      clearTimeout(hideTimer);
      if (!video.paused) hideTimer = setTimeout(() => document.body.classList.add("idle"), OSD_MS);
      draw();
    }
    function seek(delta) {
      if (!Number.isFinite(video.duration)) return;
      video.currentTime = Math.min(Math.max(video.currentTime + delta, 0), video.duration);
    }
    function changeQuality(delta) {
      const next = quality.selectedIndex + delta;
      if (quality.disabled || next < 0 || next >= quality.length) return;
      quality.selectedIndex = next;
      quality.onchange();
    }

    document.body.classList.add("tv");
    document.title = title || document.title;
    status("osd-title", title);
    video.controls = false;
    document.getElementById("osd-bottom").prepend(document.getElementById("msg"));
    ["play", "pause", "seeked"].forEach((name) => video.addEventListener(name, showOsd));
    ["timeupdate", "durationchange"].forEach((name) => video.addEventListener(name, draw));
    document.getElementById("osd").addEventListener("click", () => { ACTIONS.toggle(); showOsd(); });
    window.addEventListener("keydown", (e) => {
      const action = ACTIONS[KEYS[e.key] || CODES[e.keyCode]];
      if (!action) return;
      e.preventDefault();
      action();
      showOsd();
    });
    showOsd();
  }
</script>
</body>
</html>
