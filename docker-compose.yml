# Local development stack. `docker compose up --build`, then see README.md "Quick start".
x-app-env: &app-env
  ENVIRONMENT: development
  LOG_JSON: "true"
  DATABASE_URL: postgresql+psycopg://transcoder:transcoder@postgres:5432/transcoder
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: localhost:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  PUBLIC_MEDIA_BASE_URL: http://localhost:${MEDIA_PORT:-8080}/media
  API_KEYS: dev:dev-key:admin
  WORK_DIR: /scratch
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-300}
  JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-30}
  RECOVERY_INTERVAL_SECONDS: ${RECOVERY_INTERVAL_SECONDS:-60}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-0}

x-app: &app
  build: .
  image: media-converter:dev
  environment: *app-env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transcoder
      POSTGRES_PASSWORD: transcoder
      POSTGRES_DB: transcoder
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcoder"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    image: ${MINIO_IMAGE:-media-converter/minio:RELEASE.2025-04-22T22-12-26Z}
    build: deploy/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes: [minio-data:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 20

  api:
    <<: *app
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.cli init-storage &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      retries: 30

  worker:
    <<: *app
    command:
      - celery
      - -A
      - app.worker.celery_app
      - worker
      - -Q
      - transcode
      - --pool=solo
      - --concurrency=1
      - --without-gossip
      - --without-mingle
      - -n
      - worker@%h
      - --loglevel=INFO
    stop_grace_period: 10m
    volumes: [scratch:/scratch]
    depends_on:
      api: { condition: service_healthy }

  scheduler:
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-B", "-Q", "maintenance", "--pool=solo",
              "-n", "scheduler@%h", "--schedule=/tmp/celerybeat-schedule", "--loglevel=INFO"]
    depends_on:
      api: { condition: service_healthy }

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    environment:
      MINIO_UPSTREAM: minio:9000
      OUTPUT_BUCKET: videos-output
    ports: ["${MEDIA_PORT:-8080}:8080"]
    depends_on:
      minio: { condition: service_healthy }

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/transcoder.json:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  scratch:
